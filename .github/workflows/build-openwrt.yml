name: Build OpenWrt

on:
  repository_dispatch:
    types: [build-openwrt]

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  WORKER_URL: "${{ github.event.client_payload.worker_url }}"
  SCRIPTS_DIR: "${{ github.workspace }}/scripts"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH（仅私有插件仓库需要，可不设置 SSH_PRIVATE_KEY）
        env:
          SSH_KEY: "${{ secrets.SSH_PRIVATE_KEY }}"
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_KEY" ]; then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; fi
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: 拉取完整配置
        id: config
        env:
          BUILD_ID: "${{ github.event.client_payload.build_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/fetch-config.sh"

      - name: 上报：已开始
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          RUN_ID: "${{ github.run_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/report.sh" "$BUILD_ID" running "github_run_id=$RUN_ID"

      - name: 释放磁盘并安装依赖
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget jq curl zstd
          df -h /

      - name: 克隆主源码
        run: |
          set -e
          git clone --depth 1 -b "$(jq -r .branch config.json)" "$(jq -r .repo_url config.json)" openwrt

      - name: 自定义脚本①（feeds update 之前）
        run: |
          jq -r .diy_script_1 config.json > diy1.sh
          cd openwrt && bash ../diy1.sh

      - name: feeds update
        run: cd openwrt && ./scripts/feeds update -a

      - name: 克隆插件源码（整仓 / 稀疏）
        run: bash "$SCRIPTS_DIR/clone-plugins.sh"

      - name: feeds install
        run: |
          cd openwrt && ./scripts/feeds install -a
          # 记录本次实际用到的源码和 feeds 版本（feeds 没有锁定，每次都拉最新）
          { echo "源码 $(git rev-parse --short=8 HEAD)"; for d in feeds/*/; do [ -d "$d/.git" ] && echo "feeds $(basename "$d") @ $(git -C "$d" rev-parse --short=8 HEAD)"; done; } > /tmp/build-notes || true

      - name: 自定义脚本②（feeds install 之后）
        run: |
          jq -r .diy_script_2 config.json > diy2.sh
          cd openwrt && bash ../diy2.sh

      - name: 清理凭据（之后的 make 会执行第三方插件代码）
        run: rm -f ~/.ssh/id_ed25519

      - name: 生成配置（设备 + 插件清单 / 底稿）
        env:
          HAS_DOTCONFIG: "${{ steps.config.outputs.has_dotconfig }}"
        run: bash "$SCRIPTS_DIR/write-dotconfig.sh"

      # ── 可选：menuconfig 网页终端 ──
      - name: 启动 ttyd Web 终端
        if: steps.config.outputs.menuconfig == 'true'
        id: webterm
        env:
          TTYD_USER: "${{ secrets.TTYD_USER }}"
          TTYD_PASS: "${{ secrets.TTYD_PASS }}"
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
          OPENWRT_DIR: "${{ github.workspace }}/openwrt"
        run: bash "$SCRIPTS_DIR/webterm-start.sh"

      - name: 上报：Web 终端地址
        if: steps.config.outputs.menuconfig == 'true'
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          WEB_URL: "${{ steps.webterm.outputs.web_url }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/report.sh" "$BUILD_ID" menuconfig "web_url=$WEB_URL"

      - name: 等待 menuconfig 完成（超时 30 分钟）
        if: steps.config.outputs.menuconfig == 'true'
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/wait-menuconfig.sh"

      - name: 上报：开始编译
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/report.sh" "$BUILD_ID" compiling

      - name: 恢复编译缓存（ccache）
        if: steps.config.outputs.cache_from != ''
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
          CACHE_TAG: "${{ steps.config.outputs.cache_from }}"
        run: bash "$SCRIPTS_DIR/cache.sh" restore

      - name: 编译
        id: make
        env:
          USE_CCACHE: "${{ steps.config.outputs.use_ccache }}"
          CCACHE_MAXSIZE: "8G"
          CCACHE_COMPILERCHECK: "content"
        run: |
          cd openwrt
          set -o pipefail
          # 启用 ccache（放在 menuconfig 之后，不会被 menuconfig 推送进保存的配置版本）。
          # CONFIG_CCACHE 需要同时打开 CONFIG_DEVEL 才不会被 defconfig 丢弃，详见 enable-ccache.sh
          if [ "$USE_CCACHE" = "true" ]; then bash "$SCRIPTS_DIR/enable-ccache.sh"; fi
          env -u REPORT_TOKEN -u WORKER_URL make download -j8 2>&1 | tee /tmp/make.log
          (env -u REPORT_TOKEN -u WORKER_URL make -j"$(nproc)" || env -u REPORT_TOKEN -u WORKER_URL make -j1 V=s) 2>&1 | tee -a /tmp/make.log

      - name: ccache 统计
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' && steps.config.outputs.use_ccache == 'true' }}
        continue-on-error: true
        run: bash "$SCRIPTS_DIR/cache.sh" stats

      - name: 打包产物
        run: bash "$SCRIPTS_DIR/package-artifacts.sh"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.config.outputs.build_id }}"
          files: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*sysupgrade*
            openwrt/bin/targets/**/*factory*
            *-packages.tar.gz

      - name: 发布编译缓存（ccache）
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' && steps.config.outputs.use_ccache == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/cache.sh" publish

      - name: 清理旧 Release（保留最近 10 个）
        if: success()
        env:
          GH_TOKEN: "${{ github.token }}"
        # 只清理 build- 开头的固件 Release，缓存 Release（cache-）由缓存发布步骤自己管理
        run: gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("build-"))] | .[10:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag --yes

      - name: 上报：完成
        if: always()
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          JOB_STATUS: "${{ job.status }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
        run: bash "$SCRIPTS_DIR/report-final.sh"
