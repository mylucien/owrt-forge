name: Build OpenWrt

on:
  repository_dispatch:
    types: [build-openwrt]

env:
  WORKER_URL: "${{ github.event.client_payload.worker_url }}"
  REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
  SCRIPTS_DIR: "${{ github.workspace }}/scripts"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 检出仓库（获取 .github/scripts）
        uses: actions/checkout@v4

      - name: 修复脚本执行权限
        run: |
          chmod +x "$SCRIPTS_DIR"/*.sh
        
      - name: 拉取完整配置
        id: config
        env:
          BUILD_ID: "${{ github.event.client_payload.build_id }}"
        run: bash "$SCRIPTS_DIR/fetch-config.sh"

      - name: 上报：已开始
        run: |
          bash "$SCRIPTS_DIR/report.sh" "${{ steps.config.outputs.build_id }}" running \
            "\"github_run_id\":\"${{ github.run_id }}\""

      - name: 安装基础依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl

      - name: 克隆主源码
        run: |
          set -e
          git clone --depth 1 -b "$(jq -r .branch config.json)" \
            "$(jq -r .repo_url config.json)" openwrt

      - name: 自定义脚本①（feeds update 之前）
        run: |
          jq -r .diy_script_1 config.json > diy1.sh
          chmod +x diy1.sh
          cd openwrt && bash ../diy1.sh

      - name: feeds update
        run: cd openwrt && ./scripts/feeds update -a

      - name: 克隆插件源码（支持整仓 / 稀疏克隆）
        run: bash "$SCRIPTS_DIR/clone-plugins.sh"

      - name: feeds install
        run: cd openwrt && ./scripts/feeds install -a

      - name: 自定义脚本②（feeds install 之后）
        run: |
          jq -r .diy_script_2 config.json > diy2.sh
          chmod +x diy2.sh
          cd openwrt && bash ../diy2.sh

      - name: 写入底稿 .config（如有）
        env:
          HAS_DOTCONFIG: "${{ steps.config.outputs.has_dotconfig }}"
        run: bash "$SCRIPTS_DIR/write-dotconfig.sh"

      # ── 手动触发：ttyd menuconfig ────────────────────────────────
      - name: 启动 ttyd Web 终端
        if: steps.config.outputs.trigger_type == 'manual'
        id: webterm
        env:
          TTYD_USER: "${{ secrets.TTYD_USER }}"
          TTYD_PASS: "${{ secrets.TTYD_PASS }}"
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          OPENWRT_DIR: "${{ github.workspace }}/openwrt"
        run: bash "$SCRIPTS_DIR/webterm-start.sh"

      - name: 上报：Web 终端地址
        if: steps.config.outputs.trigger_type == 'manual'
        run: |
          bash "$SCRIPTS_DIR/report.sh" "${{ steps.config.outputs.build_id }}" menuconfig \
            "\"web_url\":\"${{ steps.webterm.outputs.web_url }}\""

      - name: 等待 menuconfig 完成（超时 30 分钟）
        if: steps.config.outputs.trigger_type == 'manual'
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
        run: bash "$SCRIPTS_DIR/wait-menuconfig.sh"
      # ── ttyd 结束 ────────────────────────────────────────────────

      - name: 上报：开始编译
        run: bash "$SCRIPTS_DIR/report.sh" "${{ steps.config.outputs.build_id }}" compiling

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 打包产物
        run: bash "$SCRIPTS_DIR/package-artifacts.sh"

      - name: 发布 Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.config.outputs.build_id }}"
          files: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*sysupgrade*
            openwrt/bin/targets/**/*factory*
            *-packages.tar.gz

      - name: 上报：完成
        if: always()
        env:
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          JOB_STATUS: "${{ job.status }}"
        run: bash "$SCRIPTS_DIR/report-final.sh"
