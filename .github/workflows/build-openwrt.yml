name: Build OpenWrt

on:
  repository_dispatch:
    types: [build-openwrt]

# 修复1：WORKER_URL 加引号，避免 https:// 中的冒号被 YAML 解析器误判
# 修复2：改用 secrets.WORKER_URL（推荐）或保持 vars.WORKER_URL，
#        但必须加引号；此处保留 vars 以兼容原配置
env:
  WORKER_URL: "${{ vars.WORKER_URL }}"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 拉取完整配置
        id: config
        run: |
          set -e
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          curl -sf -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
            "$WORKER_URL/api/builds/$BUILD_ID/config" -o config.json

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "template_id=$(jq -r '.template_id // ""' config.json)" >> "$GITHUB_OUTPUT"
          echo "trigger_type=$(jq -r '.trigger_type // "manual"' config.json)" >> "$GITHUB_OUTPUT"
          HAS=$(jq -r 'if .dotconfig_snapshot and .dotconfig_snapshot != "" then "true" else "false" end' config.json)
          echo "has_dotconfig=$HAS" >> "$GITHUB_OUTPUT"

      - name: 上报：已开始
        run: |
          curl -sf -X POST "$WORKER_URL/api/report" \
            -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ steps.config.outputs.build_id }}\",\"status\":\"running\"}"

      - name: 安装基础依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq curl

      - name: 克隆主源码
        run: |
          set -e
          git clone --depth 1 -b "$(jq -r .branch config.json)" \
            "$(jq -r .repo_url config.json)" openwrt

      - name: 自定义脚本①（feeds update 之前）
        run: |
          jq -r .diy_script_1 config.json > diy1.sh
          chmod +x diy1.sh
          cd openwrt && bash ../diy1.sh

      - name: feeds update
        run: cd openwrt && ./scripts/feeds update -a

      - name: 克隆插件源码（支持整仓 / 稀疏克隆）
        run: |
          set -e
          function git_sparse_clone() {
            branch="$1" repourl="$2" && shift 2
            git clone --depth=1 -b "$branch" --single-branch \
              --filter=blob:none --sparse "$repourl"
            repodir=$(basename "$repourl")
            cd "$repodir" && git sparse-checkout set "$@"
            mv -f "$@" ../package/
            cd .. && rm -rf "$repodir"
          }
          mkdir -p openwrt/package
          cd openwrt
          jq -c '.plugins[]' ../config.json | while read -r p; do
            url=$(echo "$p" | jq -r .git_url)
            if [ "$(echo "$p" | jq -r .sparse)" = "true" ]; then
              dirs=$(echo "$p" | jq -r '.dirs[]' | tr '\n' ' ')
              git_sparse_clone "$(echo "$p" | jq -r .branch)" "$url" $dirs
            else
              name=$(echo "$p" | jq -r .name)
              git clone --depth 1 "$url" "package/$name"
            fi
          done

      - name: feeds install
        run: cd openwrt && ./scripts/feeds install -a

      - name: 自定义脚本②（feeds install 之后）
        run: |
          jq -r .diy_script_2 config.json > diy2.sh
          chmod +x diy2.sh
          cd openwrt && bash ../diy2.sh

      - name: 写入底稿 .config（如有）
        run: |
          set -e
          if [ "${{ steps.config.outputs.has_dotconfig }}" = "true" ]; then
            jq -r .dotconfig_snapshot config.json > openwrt/.config
            cd openwrt && make defconfig
          fi

      # ── 手动触发：ttyd menuconfig ────────────────────────────────
      - name: 注入脚本 + 启动 ttyd
        if: steps.config.outputs.trigger_type == 'manual'
        id: webterm
        env:
          WORKER_URL: "${{ vars.WORKER_URL }}"
          REPORT_TOKEN: "${{ secrets.REPORT_TOKEN }}"
          TTYD_USER: "${{ secrets.TTYD_USER }}"
          TTYD_PASS: "${{ secrets.TTYD_PASS }}"
          BUILD_ID: "${{ steps.config.outputs.build_id }}"
          OPENWRT_DIR: "${{ github.workspace }}/openwrt"
        run: |
          set -eo pipefail
 
          # push-config：menuconfig 保存退出后上传 .config 到 Worker
          # 单引号 heredoc 阻止写入阶段展开，运行时读取环境变量
          sudo tee /usr/local/bin/push-config > /dev/null << 'PUSH_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${WORKER_URL:?WORKER_URL 未设置}"
          : "${REPORT_TOKEN:?REPORT_TOKEN 未设置}"
          : "${BUILD_ID:?BUILD_ID 未设置}"
          : "${OPENWRT_DIR:?OPENWRT_DIR 未设置}"
          CONTENT=$(cat "$OPENWRT_DIR/.config")
          PAYLOAD=$(jq -n \
            --arg build_id "$BUILD_ID" \
            --arg content  "$CONTENT"  \
            '{build_id: $build_id, content: $content}')
          curl -sf -X POST "$WORKER_URL/api/report/dotconfig" \
            -H "X-Report-Token: $REPORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "✅ .config 已推送"
          PUSH_SCRIPT
          sudo chmod +x /usr/local/bin/push-config

          # menuconfig-session：ttyd 会话入口
          # 未保存（Exit without saving）：脚本退出，ttyd 等待下次连接重新执行
          # 已保存（Save & Exit）：推送配置，kill ttyd，推进编译
          cat > /tmp/menuconfig-session.sh << 'SESSION_SCRIPT'
          #!/usr/bin/env bash
          cd "$OPENWRT_DIR"
          BEFORE=$(stat -c %Y "$OPENWRT_DIR/.config" 2>/dev/null || echo 0)
          make menuconfig || true
          AFTER=$(stat -c %Y "$OPENWRT_DIR/.config" 2>/dev/null || echo 0)
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo ""
            echo "✅ 保存完成，正在推送配置..."
            push-config
            touch /tmp/menuconfig-done
            pkill -f "ttyd --port 7681" || true
            echo "🚀 配置已推送，即将开始编译，可以关闭此窗口"
          else
            echo ""
            echo "⚠️ 未保存，可重新连接继续配置"
            sleep 3
          fi
          SESSION_SCRIPT
          chmod +x /tmp/menuconfig-session.sh

          # 锁定 ttyd 版本号，避免 latest 重定向偶发失败
          TTYD_VER="1.7.7"
          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VER}/ttyd.x86_64" \
            -o /tmp/ttyd_bin
          sudo install -m 0755 /tmp/ttyd_bin /usr/local/bin/ttyd

          ttyd --port 7681 \
               --credential "${TTYD_USER}:${TTYD_PASS}" \
               --max-clients 1 \
               --writable \
               /tmp/menuconfig-session.sh &

          # 修复3：同样锁定 cloudflared 版本
          CF_VER="2024.12.2"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CF_VER}/cloudflared-linux-amd64" \
            -o /tmp/cloudflared_bin
          sudo install -m 0755 /tmp/cloudflared_bin /usr/local/bin/cloudflared

          cloudflared tunnel --url http://localhost:7681 \
            --no-autoupdate > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "未能在 60 秒内获取 cloudflared 隧道地址" >&2
            cat /tmp/cf.log >&2
            exit 1
          fi

          AUTH_URL="https://${TTYD_USER}:${TTYD_PASS}@${URL#https://}"
          echo "web_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"

      - name: 上报：Web 终端地址
        if: steps.config.outputs.trigger_type == 'manual'
        run: |
          curl -sf -X POST "$WORKER_URL/api/report" \
            -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ steps.config.outputs.build_id }}\",\"status\":\"menuconfig\",\"web_url\":\"${{ steps.webterm.outputs.web_url }}\"}"

      - name: 等待 menuconfig 完成（超时 30 分钟）
        if: steps.config.outputs.trigger_type == 'manual'
        run: |
          TIMEOUT=1800
          ELAPSED=0
          while [ ! -f /tmp/menuconfig-done ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              curl -sf -X POST "$WORKER_URL/api/report" \
                -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"build_id\":\"${{ steps.config.outputs.build_id }}\",\"status\":\"failed\",\"reason\":\"menuconfig_timeout\"}"
              exit 1
            fi
          done
      # ── ttyd 结束 ────────────────────────────────────────────────

      - name: 上报：开始编译
        run: |
          curl -sf -X POST "$WORKER_URL/api/report" \
            -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ steps.config.outputs.build_id }}\",\"status\":\"compiling\"}"

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 打包产物
        run: |
          cd openwrt/bin/targets
          find . -type d -mindepth 2 -maxdepth 2 | while read dir; do
            name=$(echo "$dir" | tr '/' '-' | sed 's/^-//')
            tar czf "../../../${name}-packages.tar.gz" -C "$dir" .
          done
          cd ${{ github.workspace }}
          # 只保留 rootfs / sysupgrade 镜像 + 打包的 packages
          find openwrt/bin/targets -name "*.img.gz" -o -name "*sysupgrade*" -o -name "*factory*" | \
            xargs -I{} cp {} /tmp/release_files/ 2>/dev/null || true
          cp *-packages.tar.gz /tmp/release_files/ 2>/dev/null || true
    
      - name: 发布 Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.config.outputs.build_id }}"
          files: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*sysupgrade*
            openwrt/bin/targets/**/*factory*
            *-packages.tar.gz

      - name: 上报：完成
        if: always()
        run: |
          BUILD_ID="${{ steps.config.outputs.build_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/build-${BUILD_ID}"
          else
            STATUS="failed"
            DOWNLOAD_URL=""
          fi
          curl -sf -X POST "$WORKER_URL/api/report" \
            -H "X-Report-Token: ${{ secrets.REPORT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${BUILD_ID}\",\"status\":\"${STATUS}\",\"download_url\":\"${DOWNLOAD_URL}\"}"
